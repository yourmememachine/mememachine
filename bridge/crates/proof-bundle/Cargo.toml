[package]
name = "proof-bundle"
version = "0.1.0"
edition = "2021"
description = "Off-chain crossing proof bundles for the Machine bridge: export one self-contained JSON bundle (crossing receipt + canonical BridgeMessage + the attestation set) for a completed crossing, and verify it fully offline against the bridge's own rules."

[[bin]]
name = "crossing-proof"
path = "src/main.rs"

[dependencies]
bridge-common = { path = "../bridge-common" }
relayer = { path = "../relayer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
solana-program = "2.3"

[dev-dependencies]
borsh = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
solana-program-test = "2.3"
solana-sdk = "2.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
machine-bridge = { path = "../machine-bridge", features = ["no-entrypoint"] }
solana-lock = { path = "../solana-lock", features = ["no-entrypoint"] }
spl-token = { version = "4", features = ["no-entrypoint"] }
