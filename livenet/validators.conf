# validators.conf — per-validator settings for the MemeMachine livenet.
#
# One block per validator. On a 3-VPS setup, each host uses its own
# validator's block and its own PUBLIC_IP. On a single host, all three
# blocks apply (different ports, same PUBLIC_IP).
#
# PUBLIC_IP: the address this validator advertises in gossip. Set it to
# the host's public IP. If left empty, start-validator.sh auto-detects
# it (curl to ifconfig.me) and refuses to start if detection fails.
# GOSSIP_PORT / RPC_PORT / DYNAMIC_RANGE must not overlap between
# validators on the same host.

# --- Validator 1 (bootstrap / first node, also the public RPC node) ---
V1_PUBLIC_IP=""
V1_GOSSIP_PORT=8001
V1_DYNAMIC_RANGE="8002-8010"
V1_RPC_PORT=8899
V1_RPC_BIND="0.0.0.0"

# --- Validator 2 (joins via validator 1) ---
V2_PUBLIC_IP=""
V2_GOSSIP_PORT=8011
V2_DYNAMIC_RANGE="8012-8020"
V2_RPC_PORT=8900
V2_RPC_BIND="127.0.0.1"

# --- Validator 3 (joins via validator 1) ---
V3_PUBLIC_IP=""
V3_GOSSIP_PORT=8021
V3_DYNAMIC_RANGE="8022-8030"
V3_RPC_PORT=8901
V3_RPC_BIND="127.0.0.1"

# --- Shared ---
# Full snapshots every 1000 slots (less disk churn on a small VPS).
FULL_SNAPSHOT_INTERVAL_SLOTS=1000
# Cap the retained ledger (50,000,000 shreds) so disk use stays bounded.
LIMIT_LEDGER_SIZE=50000000
